<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#edf0e8">
  <meta name="description" content="你的瑞典语单词室。选择 Rivstart A1/A2 章节，预览、翻卡片、听写，按自己的节奏练习。">
  <title>Ordrum · 瑞典语单词室</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ordrum">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>try{const a=JSON.parse(localStorage.getItem('ordrum.appearance.v1')||'null');if(a&&['forest','paper','night'].includes(a.theme))document.documentElement.dataset.theme=a.theme;if(a&&['comfortable','compact'].includes(a.density))document.documentElement.dataset.density=a.density;}catch(_){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="study.css">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="review.css">
  <link rel="stylesheet" href="plan.css">
  <link rel="stylesheet" href="sync-health.css">
  <link rel="stylesheet" href="word-extras.css">
  <script src="study.js" defer></script>
  <script src="review.js" defer></script>
  <script src="session.js" defer></script>
  <script src="plan-core.js" defer></script>
  <script src="plan-session.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="github-sync.js" defer></script>
  <script src="cloud.js" defer></script>
  <script src="sync-health.js" defer></script>
  <script src="word-extras.js" defer></script>
  <script src="app.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Ordrum 首页"><span class="brand-icon" aria-hidden="true">ö</span><span>ordrum<span class="brand-subtitle">瑞典语单词室</span></span></a>
      <nav class="header-actions" aria-label="工具">
        <button class="quiet-button page-nav is-active" id="study-page-button" aria-current="page">首页</button>
        <button class="quiet-button page-nav" id="plan-page-button">计划学习</button>
        <button class="quiet-button icon-label" id="tasks-button"><span data-icon="cards"></span><span>学习任务</span></button>
        <button class="quiet-button icon-label settings-trigger" id="settings-button" aria-label="设置"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-1h4l1 1 .5 2 2 1 2-.5 2 3-1.5 1.5v3L21 15l-2 3-2-.5-2 1-.5 2h-5l-.5-2-2-1-2 .5-2-3L5 13v-3L3.5 8.5l2-3 2 .5 2-1Z"/><circle cx="12" cy="11.5" r="3"/></svg><span>设置</span><span id="settings-sync-badge" class="settings-sync-badge" hidden></span></button>
      </nav>
    </header>

    <main>
      <div class="workspace" id="home-page">
        <aside class="library-panel" aria-label="书籍和章节">
          <div class="panel-eyebrow">书架</div>
          <label class="sr-only" for="book-select">选择书籍</label>
          <div class="book-select-wrap"><span class="book-symbol" data-icon="book"></span><select id="book-select"><option>Rivstart A1/A2</option></select></div>
          <div class="book-caption">ORDKORT</div>
          <details id="chapter-picker" class="chapter-picker" open>
          <summary><span>选择章节</span><span id="chapter-picker-count">已选 2 章</span></summary>
          <div class="chapter-heading"><h2>选择章节</h2><div><button class="text-button" id="select-all">全选</button><span>·</span><button class="text-button" id="select-none">清空</button></div></div>
          <div id="chapter-list" class="chapter-list"><div class="loading-small">正在整理书架…</div></div>
          </details>
          <button class="secondary-button study-create-sidebar" id="create-task-button">＋ 创建学习任务</button>
          <button class="secondary-button notebook-manage-book" id="notebook-button" hidden>管理错题本</button>
        </aside>

        <section class="learning-panel" aria-label="学习区">
          <div id="task-context"></div>
          <div class="learning-heading"><div><h1 id="selection-title">正在加载单词…</h1><p id="selection-description"></p></div><div class="learned-summary"><span class="learned-icon" data-icon="check"></span><div><strong id="known-count">0</strong><span>已掌握</span></div></div></div>
          <div id="home-practice-slot"><div id="study-surface">
          <div class="mode-toolbar"><div class="mode-tabs" role="tablist" aria-label="学习模式"><button id="tab-preview" class="mode-tab active" role="tab" aria-selected="true" aria-controls="mode-content" data-mode="preview"><span data-icon="grid"></span>预览</button><button id="tab-flashcard" class="mode-tab" role="tab" aria-selected="false" aria-controls="mode-content" data-mode="flashcard"><span data-icon="cards"></span>翻卡片</button><button id="tab-dictation" class="mode-tab" role="tab" aria-selected="false" aria-controls="mode-content" data-mode="dictation"><span data-icon="headphones"></span>听写</button></div></div>
          <div id="mode-content" role="tabpanel" aria-labelledby="tab-preview"><div class="loading-state"><span class="spinner"></span><p>正在打开你的单词卡…</p></div></div>
          </div></div>
        </section>
      </div>
      <section id="plan-page" aria-label="计划学习" hidden></section>
      <footer class="site-footer"><span>Ordrum</span><span id="source-footer">Rivstart A1/A2 Ordkort</span></footer>
    </main>
  </div>
  <dialog id="app-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
